name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      # The committed JSON Schema is generated from the Pydantic models
      # (ADR-0002). This is what stops it silently rotting.
      - name: Canonical schema is not stale
        run: python -m ucm_bridge.tooling.emit_schema --check

      - name: Tests
        run: pytest -q
