name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      # The committed JSON Schema is generated from the Pydantic models
      # (ADR-0002). This is what stops it silently rotting.
      - name: Canonical schema is not stale
        run: python -m ucm_bridge.tooling.emit_schema --check

      - name: Tests
        run: pytest -q

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      # `npm run build` type-checks first, so a shape that drifted from the API
      # fails here rather than as a blank screen in front of an operator.
      - name: Type check and build
        working-directory: ui
        run: npm run build

      # A known-vulnerable dependency should fail the build, not sit in a report
      # nobody reads. react-router was dropped for exactly this reason; see
      # ui/src/router.tsx.
      - name: Audit dependencies
        working-directory: ui
        run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deployment is one container, so a broken Dockerfile is a broken
      # release. Build it, do not push it.
      - name: Build the deployment image
        run: docker build -t ucm-bridge-console .

      - name: The container serves the API and the console
        run: |
          docker run -d --name console -p 7860:7860 ucm-bridge-console
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/api/health
          # The SPA fallback must serve index.html for a client route, or a
          # refresh anywhere but / would 404.
          curl -fsS http://127.0.0.1:7860/waves | grep -q '<div id="root">'
          docker logs console
          docker rm -f console
