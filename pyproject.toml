[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucm-bridge"
version = "0.1.0"
description = "Bidirectional Unified Communications migration and coexistence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# Live vendor transports. Not needed for tests: every connector is exercised
# through recorded cassettes, so the suite runs with no vendor SDK installed.
cucm = [
    "zeep>=4.2",
    "requests>=2.32",
]
http = [
    "httpx>=0.27",
]
temporal = [
    "temporalio>=1.6",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ucm-emit-schema = "ucm_bridge.tooling.emit_schema:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ucm_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ucm_bridge"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

# Optional live-transport dependencies. They are imported inside functions and
# guarded with a clear error, so the type checker not seeing them is expected.
[[tool.mypy.overrides]]
module = ["zeep.*", "httpx.*", "requests.*", "temporalio.*"]
ignore_missing_imports = true
